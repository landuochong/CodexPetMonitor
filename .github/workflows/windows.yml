name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore windows/CodexPetMonitor.Windows/CodexPetMonitor.Windows.csproj
      - name: Build
        run: dotnet build windows/CodexPetMonitor.Windows/CodexPetMonitor.Windows.csproj --configuration Release --no-restore
      - name: Publish win-x64
        shell: pwsh
        run: ./windows/build.ps1 -Runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CodexPetMonitor-win-x64
          path: windows/publish/win-x64/
